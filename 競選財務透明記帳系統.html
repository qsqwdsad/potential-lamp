<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清廉選戰：雲端協作記帳系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.321.0"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        @media print {
            body { background-color: white; }
            .print-hidden { display: none !important; }
            .print-full-width { width: 100% !important; max-width: 100% !important; grid-column: span 12 / span 12 !important; }
            .print-shadow-none { box-shadow: none !important; border: none !important; }
            .print-break-inside-avoid { break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // 匯入 Firebase SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useMemo, useRef } = React;

        // ==========================================
        // 🔥 Firebase 設定區塊 (雲端大腦)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBUGHn6GRfmwq2HQV-U90bs5-xw1Popgu4",
            authDomain: "qailtang-tiloan.firebaseapp.com",
            projectId: "qailtang-tiloan",
            storageBucket: "qailtang-tiloan.firebasestorage.app",
            messagingSenderId: "259369901981",
            appId: "1:259369901981:web:0f192a6bbf156615419974"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // 設定資料庫儲存路徑
        const getDbPath = (userId) => `users/${userId}/transactions`;

        const DEFAULT_CATEGORIES = {
            INCOME: ['個人捐贈', '匿名捐贈', '政黨補助', '人民團體捐贈', '企業捐贈', '自有資金', '其他收入'],
            EXPENSE: ['人事費用', '宣傳支出', '租用競選辦事處', '集會支出', '交通運輸', '雜支支出', '公共關係', '返還捐贈']
        };
        const STAGES = ['備選期', '正式競選', '選後服務處'];

        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        const resizeImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        const MAX_HEIGHT = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        };

        const PieChart = ({ data, title }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartInstance.current) chartInstance.current.destroy();
                if (data.length === 0) return;

                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: data.map(d => d.label),
                        datasets: [{
                            data: data.map(d => d.value),
                            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16', '#64748b', '#14b8a6'],
                            borderWidth: 1
                        }]
                    },
                    options: { 
                        responsive: true, 
                        plugins: { title: { display: true, text: title, font: { size: 16, family: 'Noto Sans TC' } } } 
                    }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [data, title]);

            if (data.length === 0) return <div className="text-slate-400 text-center py-8">尚無資料可產出圖表</div>;
            return <canvas ref={chartRef}></canvas>;
        };

        function App() {
            // 雲端驗證狀態
            const [user, setUser] = useState(null);
            const [isAuthLoading, setIsAuthLoading] = useState(true);
            const [dbStatus, setDbStatus] = useState('等待登入...');

            // 登入表單狀態
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isRegistering, setIsRegistering] = useState(false);
            const [authError, setAuthError] = useState('');

            // 帳目狀態 (現改由雲端同步)
            const [transactions, setTransactions] = useState([]);
            const [customCategories, setCustomCategories] = useState(() => {
                const saved = localStorage.getItem('campaign_custom_categories');
                return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
            });
            
            const [activeStage, setActiveStage] = useState('備選期');
            const [showStatus, setShowStatus] = useState(null);
            const [showCategoryManager, setShowCategoryManager] = useState(false);
            const [previewImage, setPreviewImage] = useState(null);
            const [viewMode, setViewMode] = useState('list');
            const [searchTerm, setSearchTerm] = useState('');
            
            const imageInputRef = useRef(null);
            
            const [type, setType] = useState('EXPENSE');
            const [amount, setAmount] = useState('');
            const [category, setCategory] = useState(customCategories.EXPENSE[0]);
            const [note, setNote] = useState('');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [newCatName, setNewCatName] = useState('');
            const [receiptImage, setReceiptImage] = useState(null);

            // 1. 監聽登入狀態
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    setIsAuthLoading(false);
                    if (!currentUser) setDbStatus('未登入');
                });
                return () => unsubscribe();
            }, []);

            // 處理登入/註冊
            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError('');
                setIsAuthLoading(true);
                try {
                    if (isRegistering) {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } else {
                        await signInWithEmailAndPassword(auth, email, password);
                    }
                } catch (error) {
                    console.error(error);
                    // 翻譯常見的 Firebase 錯誤訊息
                    let errorMsg = "發生錯誤，請稍後再試。";
                    if (error.code === 'auth/invalid-email') errorMsg = '無效的電子郵件格式。';
                    else if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') errorMsg = '帳號或密碼錯誤。';
                    else if (error.code === 'auth/email-already-in-use') errorMsg = '此電子郵件已被註冊過。';
                    else if (error.code === 'auth/weak-password') errorMsg = '密碼太弱，請至少輸入 6 個字元。';
                    setAuthError(errorMsg);
                    setIsAuthLoading(false);
                }
            };

            const handleSignOut = () => {
                if(window.confirm('確定要登出嗎？')) {
                    signOut(auth);
                }
            };

            // 2. 監聽 Firestore 雲端資料 (雙向綁定)
            useEffect(() => {
                if (!user) {
                    setTransactions([]); // 未登入時清空畫面資料
                    return;
                }
                setDbStatus('同步中...');

                const colRef = collection(db, getDbPath(user.uid));
                
                // onSnapshot 會自動即時抓取雲端變化
                const unsubscribe = onSnapshot(colRef, (snapshot) => {
                    const data = [];
                    snapshot.forEach(doc => {
                        data.push({ dbId: doc.id, ...doc.data() });
                    });
                    
                    // 在前端進行排序
                    data.sort((a, b) => new Date(b.date).getTime() - new Date(a.date).getTime() || new Date(b.createdAt) - new Date(a.createdAt));
                    setTransactions(data);
                    setDbStatus('已與雲端同步');
                }, (error) => {
                    console.error("資料讀取錯誤:", error);
                    setDbStatus('權限不足或同步錯誤');
                });

                return () => unsubscribe();
            }, [user]);

            // 圖示初始化與本地類別儲存
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
            useEffect(() => { localStorage.setItem('campaign_custom_categories', JSON.stringify(customCategories)); }, [customCategories]);
            useEffect(() => { setCategory(customCategories[type][0] || ''); }, [type, customCategories]);

            const triggerStatus = (msg) => {
                setShowStatus(msg);
                setTimeout(() => setShowStatus(null), 3000);
            };

            const handleImageUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                triggerStatus("處理圖片中...");
                try {
                    const compressedBase64 = await resizeImage(file);
                    setReceiptImage(compressedBase64);
                    triggerStatus("圖片處理完成");
                } catch (error) {
                    alert("圖片處理失敗");
                }
            };

            // 新增帳目寫入雲端
            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!amount || !user) return;

                const newTransaction = {
                    type,
                    amount: parseFloat(amount),
                    category,
                    note,
                    date,
                    stage: activeStage,
                    image: receiptImage,
                    createdAt: new Date().toISOString(),
                    recordedBy: user.uid // 稽核軌跡：記錄是誰新增的
                };

                try {
                    triggerStatus("上傳雲端中...");
                    const colRef = collection(db, getDbPath(user.uid));
                    await addDoc(colRef, newTransaction);
                    
                    setAmount('');
                    setNote('');
                    setReceiptImage(null);
                    if(imageInputRef.current) imageInputRef.current.value = "";
                    triggerStatus("✔ 帳目已成功儲存至雲端");
                } catch (err) {
                    console.error("寫入失敗", err);
                    alert("寫入雲端失敗，請確認您的帳號是否有權限寫入");
                }
            };

            // 刪除雲端帳目
            const deleteTransaction = async (dbId) => {
                if (window.confirm("確定要從雲端永久刪除這筆記錄嗎？")) {
                    try {
                        await deleteDoc(doc(db, getDbPath(user.uid), dbId));
                        triggerStatus("✔ 已刪除雲端紀錄");
                    } catch (err) {
                        alert("刪除失敗");
                    }
                }
            };

            const handleAddCategory = () => {
                if (!newCatName.trim()) return;
                if (customCategories[type].includes(newCatName.trim())) return alert("此類別已存在");
                setCustomCategories({ ...customCategories, [type]: [...customCategories[type], newCatName.trim()] });
                setNewCatName('');
            };

            const handleDeleteCategory = (catToDelete, catType) => {
                if (window.confirm(`確定要刪除「${catToDelete}」類別嗎？`)) {
                    setCustomCategories({ ...customCategories, [catType]: customCategories[catType].filter(c => c !== catToDelete) });
                }
            };

            const stats = useMemo(() => {
                const stageData = transactions.filter(t => t.stage === activeStage);
                const income = stageData.filter(t => t.type === 'INCOME').reduce((acc, t) => acc + t.amount, 0);
                const expense = stageData.filter(t => t.type === 'EXPENSE').reduce((acc, t) => acc + t.amount, 0);
                return { income, expense, balance: income - expense };
            }, [transactions, activeStage]);

            const chartData = useMemo(() => {
                const stageData = transactions.filter(t => t.stage === activeStage);
                const incomes = {}; const expenses = {};
                stageData.forEach(t => {
                    if (t.type === 'INCOME') incomes[t.category] = (incomes[t.category] || 0) + t.amount;
                    else expenses[t.category] = (expenses[t.category] || 0) + t.amount;
                });
                return {
                    income: Object.keys(incomes).map(k => ({ label: k, value: incomes[k] })).sort((a,b)=>b.value-a.value),
                    expense: Object.keys(expenses).map(k => ({ label: k, value: expenses[k] })).sort((a,b)=>b.value-a.value)
                };
            }, [transactions, activeStage]);

            const filteredTransactions = useMemo(() => {
                let data = transactions.filter(t => t.stage === activeStage);
                if (searchTerm) {
                    const lowerTerm = searchTerm.toLowerCase();
                    data = data.filter(t => 
                        (t.note && t.note.toLowerCase().includes(lowerTerm)) || 
                        (t.category && t.category.toLowerCase().includes(lowerTerm)) ||
                        (t.date && t.date.includes(lowerTerm))
                    );
                }
                return data;
            }, [transactions, activeStage, searchTerm]);

            // --- 登入畫面渲染 ---
            if (isAuthLoading && !authError) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 flex-col gap-4">
                        <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                        <p className="text-slate-500 font-medium">系統安全連線中...</p>
                    </div>
                );
            }

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                        <div className="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
                            <div className="p-8 text-center bg-slate-800 text-white">
                                <Icon name="shield-check" size={48} className="mx-auto text-blue-400 mb-4" />
                                <h2 className="text-2xl font-bold">清廉選戰：雲端系統</h2>
                                <p className="text-slate-400 mt-2 text-sm">請登入以存取您的專屬加密資料庫</p>
                            </div>
                            <div className="p-8">
                                {authError && (
                                    <div className="mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg flex items-start gap-2 border border-red-100">
                                        <Icon name="alert-circle" size={18} className="shrink-0 mt-0.5" />
                                        <span>{authError}</span>
                                    </div>
                                )}
                                <form onSubmit={handleAuth} className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">電子郵件</label>
                                        <div className="relative">
                                            <Icon name="mail" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                            <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="team@example.com" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">密碼</label>
                                        <div className="relative">
                                            <Icon name="lock" size={18} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                            <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 transition-all" placeholder="••••••••" />
                                        </div>
                                    </div>
                                    <button type="submit" disabled={isAuthLoading} className="w-full py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-md transition-colors disabled:bg-blue-400 flex justify-center items-center gap-2">
                                        {isAuthLoading ? <Icon name="loader" className="animate-spin" /> : (isRegistering ? '註冊新帳號' : '安全登入')}
                                    </button>
                                </form>
                                <div className="mt-6 text-center">
                                    <button type="button" onClick={() => { setIsRegistering(!isRegistering); setAuthError(''); }} className="text-sm text-slate-500 hover:text-blue-600 font-medium">
                                        {isRegistering ? '已有帳號？點此登入' : '還沒有帳號？點此註冊'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }
            // --- 登入畫面結束 ---

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-6xl mx-auto">
                        
                        {/* Header */}
                        <header className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
                            <div>
                                <h1 className="text-3xl font-bold text-slate-800 flex items-center gap-2">
                                    <Icon name="cloud" className="text-blue-600" />
                                    清廉選戰：雲端協作版
                                </h1>
                                <p className="text-slate-500 mt-1 flex items-center gap-2 print-hidden">
                                    <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                    {dbStatus} | 登入信箱：{user?.email}
                                </p>
                            </div>
                            
                            <div className="flex flex-wrap gap-2 print-hidden">
                                <button onClick={() => window.print()} className="flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 rounded-lg text-sm font-medium hover:bg-slate-50 text-slate-600 shadow-sm">
                                    <Icon name="printer" size={16} /> 列印明細
                                </button>
                                <button onClick={handleSignOut} className="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 border border-red-100 rounded-lg text-sm font-medium hover:bg-red-100 transition-colors">
                                    <Icon name="log-out" size={16} /> 安全登出
                                </button>
                            </div>
                        </header>

                        {showStatus && (
                            <div className="mb-4 p-3 bg-blue-50 border border-blue-200 text-blue-700 rounded-lg flex items-center gap-2 print-hidden">
                                <Icon name="check-circle" size={18} /> {showStatus}
                            </div>
                        )}

                        {/* Stage Tabs */}
                        <div className="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200 mb-8 w-fit overflow-x-auto print-hidden">
                            {STAGES.map(s => (
                                <button key={s} onClick={() => setActiveStage(s)} className={`px-6 py-2 rounded-lg text-sm font-medium transition-all whitespace-nowrap ${activeStage === s ? 'bg-slate-800 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100'}`}>
                                    {s}
                                </button>
                            ))}
                        </div>
                        
                        {/* Print only header */}
                        <div className="hidden print:block mb-4">
                            <h2 className="text-xl font-bold border-b pb-2">雲端報表階段：{activeStage} | 列印日期：{new Date().toLocaleDateString()}</h2>
                        </div>

                        {/* Dashboard */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 print-break-inside-avoid">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 print-shadow-none">
                                <div className="bg-green-100 p-3 rounded-full text-green-600"><Icon name="trending-up" /></div>
                                <div><p className="text-sm text-slate-500">總收入 ({activeStage})</p><p className="text-2xl font-bold">${stats.income.toLocaleString()}</p></div>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 print-shadow-none">
                                <div className="bg-red-100 p-3 rounded-full text-red-600"><Icon name="trending-down" /></div>
                                <div><p className="text-sm text-slate-500">總支出 ({activeStage})</p><p className="text-2xl font-bold">${stats.expense.toLocaleString()}</p></div>
                            </div>
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center gap-4 print-shadow-none">
                                <div className="bg-blue-100 p-3 rounded-full text-blue-600"><Icon name="wallet" /></div>
                                <div><p className="text-sm text-slate-500">當前結餘</p><p className={`text-2xl font-bold ${stats.balance >= 0 ? 'text-blue-600' : 'text-orange-600'}`}>${stats.balance.toLocaleString()}</p></div>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            
                            {/* 新增帳目表單 */}
                            <div className="lg:col-span-4 print-hidden">
                                <div className="bg-white p-6 rounded-2xl shadow-md border border-slate-200 sticky top-4">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-lg font-semibold flex items-center gap-2"><Icon name="plus-circle" className="text-blue-500" /> 雲端新增帳目</h3>
                                        <button onClick={() => setShowCategoryManager(true)} className="text-slate-400 hover:text-blue-600 transition-colors"><Icon name="settings" size={18} /></button>
                                    </div>
                                    <form onSubmit={handleSubmit} className="space-y-4">
                                        <div className="flex p-1 bg-slate-100 rounded-lg">
                                            <button type="button" onClick={() => setType('EXPENSE')} className={`flex-1 py-2 text-sm font-medium rounded-md transition-all ${type === 'EXPENSE' ? 'bg-white shadow text-red-600' : 'text-slate-500'}`}>支出</button>
                                            <button type="button" onClick={() => setType('INCOME')} className={`flex-1 py-2 text-sm font-medium rounded-md transition-all ${type === 'INCOME' ? 'bg-white shadow text-green-600' : 'text-slate-500'}`}>收入</button>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">金額</label>
                                            <input type="number" required value={amount} onChange={(e) => setAmount(e.target.value)} className="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500" placeholder="0" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">類別</label>
                                            <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full px-4 py-2 rounded-lg border border-slate-200 bg-white outline-none focus:ring-2 focus:ring-blue-500">
                                                {customCategories[type].map(c => <option key={c} value={c}>{c}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">日期</label>
                                            <input type="date" required value={date} onChange={(e) => setDate(e.target.value)} className="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">備註/對象</label>
                                            <textarea value={note} onChange={(e) => setNote(e.target.value)} className="w-full px-4 py-2 rounded-lg border border-slate-200 outline-none focus:ring-2 focus:ring-blue-500" rows="2"></textarea>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1 flex justify-between">
                                                <span>來源憑證/照片 <span className="text-slate-400 font-normal">(選填)</span></span>
                                                {receiptImage && <button type="button" onClick={()=>{setReceiptImage(null); imageInputRef.current.value="";}} className="text-red-500 text-xs hover:underline">移除</button>}
                                            </label>
                                            {receiptImage ? (
                                                <img src={receiptImage} alt="Receipt preview" className="w-full h-32 object-cover rounded-lg border border-slate-200 cursor-pointer" onClick={() => setPreviewImage(receiptImage)} />
                                            ) : (
                                                <label className="flex items-center justify-center w-full px-4 py-4 rounded-lg border-2 border-dashed border-slate-300 hover:border-blue-500 hover:bg-blue-50 cursor-pointer transition-colors">
                                                    <div className="flex flex-col items-center gap-1 text-slate-500">
                                                        <Icon name="camera" size={24} />
                                                        <span className="text-sm">點擊拍照或上傳圖片</span>
                                                    </div>
                                                    <input type="file" accept="image/*" capture="environment" ref={imageInputRef} onChange={handleImageUpload} className="hidden" />
                                                </label>
                                            )}
                                        </div>
                                        <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-lg flex items-center justify-center gap-2">同步寫入雲端</button>
                                    </form>
                                </div>
                            </div>

                            {/* 帳務列表 */}
                            <div className="lg:col-span-8 print-full-width">
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-shadow-none">
                                    <div className="p-4 md:p-6 border-b border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                        <h3 className="text-lg font-semibold flex items-center gap-2 whitespace-nowrap"><Icon name="server" className="text-slate-500" /> 雲端帳務明細 ({activeStage})</h3>
                                        
                                        <div className="flex items-center gap-3 w-full md:w-auto print-hidden">
                                            <div className="relative flex-1 md:w-64">
                                                <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                                <input type="text" placeholder="搜尋備註、類別..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500 transition-all"/>
                                            </div>
                                            <div className="flex bg-slate-100 rounded-lg p-1 shrink-0">
                                                <button onClick={() => setViewMode('list')} className={`p-1.5 rounded-md transition-all ${viewMode === 'list' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`} title="列表檢視"><Icon name="list" size={18} /></button>
                                                <button onClick={() => setViewMode('chart')} className={`p-1.5 rounded-md transition-all ${viewMode === 'chart' ? 'bg-white shadow text-blue-600' : 'text-slate-500'}`} title="圖表分析"><Icon name="pie-chart" size={18} /></button>
                                            </div>
                                        </div>
                                    </div>

                                    {viewMode === 'chart' ? (
                                        <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-8 print-break-inside-avoid">
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                <PieChart data={chartData.expense} title="支出分佈分析" />
                                            </div>
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                <PieChart data={chartData.income} title="收入來源分析" />
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left">
                                                <thead className="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-200">
                                                    <tr>
                                                        <th className="px-6 py-3">日期</th>
                                                        <th className="px-6 py-3">類別</th>
                                                        <th className="px-6 py-3">說明</th>
                                                        <th className="px-6 py-3 text-center print-hidden">憑證</th>
                                                        <th className="px-6 py-3 text-right">金額</th>
                                                        <th className="px-6 py-3 text-center print-hidden">操作</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {filteredTransactions.length === 0 ? (
                                                        <tr><td colSpan="6" className="px-6 py-12 text-center text-slate-400">{searchTerm ? '無符合條件資料' : '雲端尚無資料，請新增您的第一筆帳目。'}</td></tr>
                                                    ) : (
                                                        filteredTransactions.map((t) => (
                                                            <tr key={t.dbId} className="hover:bg-slate-50 transition-colors">
                                                                <td className="px-6 py-4 text-sm text-slate-600 whitespace-nowrap">{t.date}</td>
                                                                <td className="px-6 py-4 whitespace-nowrap"><span className={`px-2 py-1 rounded-md text-xs font-medium ${t.type === 'INCOME' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{t.category}</span></td>
                                                                <td className="px-6 py-4 text-sm text-slate-600 max-w-[200px] truncate" title={t.note}>{t.note || '-'}</td>
                                                                <td className="px-6 py-4 text-center print-hidden">
                                                                    {t.image ? (
                                                                        <button onClick={() => setPreviewImage(t.image)} className="text-blue-500 hover:text-blue-700" title="查看圖片"><Icon name="image" size={18} className="mx-auto" /></button>
                                                                    ) : <span className="text-slate-300">-</span>}
                                                                </td>
                                                                <td className={`px-6 py-4 text-sm font-bold text-right whitespace-nowrap ${t.type === 'INCOME' ? 'text-green-600' : 'text-red-600'}`}>{t.type === 'INCOME' ? '+' : '-'}{t.amount.toLocaleString()}</td>
                                                                <td className="px-6 py-4 text-center print-hidden"><button onClick={() => deleteTransaction(t.dbId)} className="text-slate-300 hover:text-red-500 transition-colors" title="刪除雲端紀錄"><Icon name="trash-2" size={18} className="mx-auto" /></button></td>
                                                            </tr>
                                                        ))
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Category Manager Modal */}
                        {showCategoryManager && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 print-hidden">
                                <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md">
                                    <div className="p-4 border-b flex justify-between items-center">
                                        <h3 className="font-bold flex items-center gap-2"><Icon name="settings" size={18} /> 管理 {type === 'INCOME' ? '收入' : '支出'} 類別</h3>
                                        <button onClick={() => setShowCategoryManager(false)} className="text-slate-400 hover:text-slate-600"><Icon name="x" /></button>
                                    </div>
                                    <div className="p-6">
                                        <div className="flex gap-2 mb-6">
                                            <input type="text" value={newCatName} onChange={(e) => setNewCatName(e.target.value)} className="flex-1 px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500" placeholder="新類別名稱..." onKeyPress={(e) => e.key === 'Enter' && handleAddCategory()} />
                                            <button onClick={handleAddCategory} className="bg-blue-600 hover:bg-blue-700 transition-colors text-white p-2 rounded-lg"><Icon name="plus" /></button>
                                        </div>
                                        <div className="space-y-2 max-h-60 overflow-y-auto pr-2">
                                            {customCategories[type].map(cat => (
                                                <div key={cat} className="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100">
                                                    <span className="text-sm font-medium">{cat}</span>
                                                    <button onClick={() => handleDeleteCategory(cat, type)} className="text-slate-400 hover:text-red-500 transition-colors"><Icon name="trash-2" size={16} /></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="p-4 bg-slate-50 border-t rounded-b-2xl text-center"><button onClick={() => setShowCategoryManager(false)} className="text-sm font-medium text-blue-600 hover:underline">完成並關閉</button></div>
                                </div>
                            </div>
                        )}

                        {/* Image Preview Modal */}
                        {previewImage && (
                            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4 print-hidden" onClick={() => setPreviewImage(null)}>
                                <div className="relative max-w-4xl w-full max-h-screen flex flex-col items-center justify-center" onClick={e => e.stopPropagation()}>
                                    <button onClick={() => setPreviewImage(null)} className="absolute -top-10 right-0 text-white hover:text-slate-300 transition-colors"><Icon name="x" size={32} /></button>
                                    <img src={previewImage} alt="Receipt Full" className="max-w-full max-h-[85vh] object-contain rounded-lg shadow-2xl" />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
