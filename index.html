<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradeLedger Pro · 合約交易日誌</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#eef1f5;--panel:#ffffff;--panel2:#f5f7fa;--text:#111a2c;--muted:#66728a;--line:#dfe5ee;--line2:#eceff5;
  --accent:#2457d6;--accent2:rgba(36,87,214,.09);--pos:#0c8f5a;--neg:#cf3a2f;--warn:#b7791f;
  --posbg:rgba(12,143,90,.11);--negbg:rgba(207,58,47,.11);--warnbg:rgba(183,121,31,.13);
  --shadow:0 1px 0 rgba(17,26,44,.04),0 10px 30px -12px rgba(17,26,44,.14);
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Segoe UI",system-ui,-apple-system,sans-serif;
}
[data-theme=dark]{
  --bg:#0b1220;--panel:#111b2e;--panel2:#0e1728;--text:#e6ecf7;--muted:#8794ae;--line:#223051;--line2:#1a2641;
  --accent:#7ba3ff;--accent2:rgba(123,163,255,.13);--pos:#3fd49b;--neg:#ff7b70;--warn:#f0b957;
  --posbg:rgba(63,212,155,.13);--negbg:rgba(255,123,112,.14);--warnbg:rgba(240,185,87,.14);
  --shadow:0 1px 0 rgba(255,255,255,.03),0 14px 34px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td,.kpi b,.hero-eq{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.muted{color:var(--muted)}.warn{color:var(--warn)}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 22px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--text);color:var(--panel);display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:-1px}
.brand b{display:block;font-size:15px;line-height:1.2}.brand small{color:var(--muted);font-size:12px}
.nav button{display:flex;gap:11px;align-items:center;width:100%;padding:10px 12px;border:0;background:none;border-radius:9px;color:var(--muted);cursor:pointer;text-align:left;font-weight:500;margin-bottom:2px}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.on{background:var(--accent2);color:var(--accent);font-weight:700}
.side-foot{margin-top:auto;padding:14px 10px;border-top:1px solid var(--line)}
.side-foot span{font-size:12px;color:var(--muted);display:block}.side-foot b{font-size:19px}
main{padding:26px 32px 90px;min-width:0;max-width:1480px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:24px;letter-spacing:-.3px}.top p{color:var(--muted);font-size:13px}
.top-r{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
.btn.danger{color:var(--neg)}.btn.danger:hover{border-color:var(--neg);color:var(--neg)}
.btn.sm{padding:5px 10px;font-size:12.5px}.btn.icon{padding:8px 11px}
select,input[type=text],input[type=number],input[type=datetime-local],input[type=password],textarea{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
select{width:auto}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{color:var(--muted);font-weight:400;font-size:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mb{margin-bottom:16px}
.chart{position:relative;height:250px}.chart.tall{height:300px}.chart.sm{height:200px}
.empty{padding:34px 12px;text-align:center;color:var(--muted)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:0;padding:0;overflow:hidden}
.hero-l{padding:22px 24px 8px;position:relative}
.hero-l small{color:var(--muted)}
.hero-eq{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin:4px 0 4px}
.hero-sub{font-size:13px}
.hero .chart{height:150px;margin:6px -2px 0}
.hero-r{border-left:1px solid var(--line);padding:22px 24px;display:flex;gap:20px;align-items:center}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font-size:26px;line-height:1}.ring span{font-size:11px;color:var(--muted)}
.hero-r ul{list-style:none;padding:0;font-size:13px;display:grid;gap:7px;min-width:0}
.hero-r li{display:flex;justify-content:space-between;gap:12px}
/* kpi strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.kpi{padding:14px 18px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.kpi:nth-child(4n){border-right:0}.kpi:nth-last-child(-n+4){border-bottom:0}
.kpi span{font-size:12.5px;color:var(--muted)}.kpi b{display:block;font-size:21px;letter-spacing:-.4px;margin-top:1px}.kpi small{color:var(--muted);font-size:12px}
/* alerts */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:10px;margin-bottom:10px;font-size:13.5px}
.alert.bad{background:var(--negbg);color:var(--neg)}.alert.warn{background:var(--warnbg);color:var(--warn)}.alert.info{background:var(--accent2);color:var(--accent)}
.alert b{font-weight:700}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:900px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;background:var(--panel2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:13.5px}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--panel2)}
tr:last-child td{border-bottom:0}
.r{text-align:right}.c{text-align:center}
td small{display:block;color:var(--muted);font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag.long{background:var(--posbg);color:var(--pos);border-color:transparent}.tag.short{background:var(--negbg);color:var(--neg);border-color:transparent}
.tag.ok{background:var(--posbg);color:var(--pos);border-color:transparent}.tag.bad{background:var(--negbg);color:var(--neg);border-color:transparent}.tag.open{background:var(--accent2);color:var(--accent);border-color:transparent}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input[type=text]{width:220px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 13px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.seg label{padding:8px 16px;cursor:pointer;color:var(--muted);font-weight:700}
.seg input{display:none}.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--accent);color:#fff}
.seg label:has(input[value=Long]:checked){background:var(--pos)}.seg label:has(input[value=Short]:checked){background:var(--neg)}
/* progress */
.bar{height:7px;background:var(--line2);border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar i.bad{background:var(--neg)}.bar i.warn{background:var(--warn)}.bar i.ok{background:var(--pos)}
.meter{margin-bottom:14px}.meter div{display:flex;justify-content:space-between;font-size:13px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(70px,.9fr);gap:6px}
.cal .h{font-size:12px;color:var(--muted);text-align:center;padding:4px}
.cell{min-height:78px;border:1px solid var(--line2);border-radius:9px;padding:6px 8px;background:var(--panel2);font-size:12px;cursor:default}
.cell.has{cursor:pointer}.cell.has:hover{border-color:var(--accent)}
.cell .d{color:var(--muted)}.cell b{display:block;font-size:14px;margin-top:6px}
.cell.wk{background:transparent;border-style:dashed}
.cell.today{border-color:var(--accent)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(7,12,24,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:50;overflow-y:auto;backdrop-filter:blur(2px)}
.overlay.show{display:flex}.overlay.top{z-index:80;align-items:center}
.dlg{background:var(--panel);border-radius:14px;border:1px solid var(--line);width:100%;max-width:960px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .16s ease-out}
.dlg.sm{max-width:400px;padding:22px}.dlg.sm h3{margin-bottom:6px;font-size:17px}.dlg.sm p{color:var(--muted);margin-bottom:18px}
.dlg.sm .row{display:flex;gap:8px;justify-content:flex-end}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.dlg{animation:none}}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.dh h2{font-size:17px}
.db{padding:20px 22px}
.df{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--panel);border-radius:0 0 14px 14px}
.fgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px}
.fs{margin-bottom:20px}.fs>h4{font-size:13px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line2)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.fl+*{margin-bottom:0}
.field{margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:13px;background:var(--panel)}
.chip input{display:none}.chip:has(input:checked){background:var(--accent2);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.mis:has(input:checked){background:var(--negbg);border-color:var(--neg);color:var(--neg)}
.chip .x{cursor:pointer;color:var(--muted);font-weight:700}.chip .x:hover{color:var(--neg)}
.chk{display:flex;gap:9px;align-items:center;padding:7px 0;cursor:pointer}.chk input{width:17px;height:17px;accent-color:var(--accent)}
.pv{position:sticky;top:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px}
.pv h4{font-size:13px;margin-bottom:10px}
.pv dl{display:grid;grid-template-columns:auto auto;gap:7px 10px;font-size:13px}.pv dt{color:var(--muted)}.pv dd{text-align:right;font-weight:600}
.pv .big{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:2px 0 12px}
.pv ul{list-style:none;padding:0;margin-top:12px;display:grid;gap:6px;font-size:12.5px}
.pv li{padding:7px 10px;border-radius:8px}.pv li.bad{background:var(--negbg);color:var(--neg)}.pv li.warn{background:var(--warnbg);color:var(--warn)}.pv li.ok{background:var(--posbg);color:var(--pos)}
.shot{max-width:100%;max-height:220px;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;display:block;margin-top:8px}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kv div{background:var(--panel2);border-radius:10px;padding:10px 12px}.kv span{font-size:12px;color:var(--muted);display:block}.kv b{font-size:15px}
.crow{display:grid;grid-template-columns:1.2fr .9fr 1.5fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.note{white-space:pre-wrap;background:var(--panel2);border-radius:10px;padding:12px;margin-top:6px;font-size:13.5px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:8px}
#toast div{background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);font-size:13.5px}
.bottom{display:none}
.hero-note{padding:46px 24px;text-align:center}.hero-note h2{font-size:22px;margin-bottom:8px}.hero-note p{color:var(--muted);max-width:480px;margin:0 auto 20px}
footer{margin-top:30px;color:var(--muted);font-size:12px;text-align:center}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px;cursor:pointer}.list-item:last-child{border:0}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(4n){border-right:1px solid var(--line2)}.kpi:nth-child(2n){border-right:0}.kpi:nth-last-child(-n+4){border-bottom:1px solid var(--line2)}.kpi:nth-last-child(-n+2){border-bottom:0}.hero{grid-template-columns:1fr}.hero-r{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}.side{display:none}
  main{padding:18px 14px 100px}
  .g2,.g3,.g21,.fgrid{grid-template-columns:1fr}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bottom{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom button{border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:2px;font-size:10.5px;padding:4px 0;cursor:pointer}
  .bottom button.on{color:var(--accent);font-weight:700}
  .top h1{font-size:20px}.hero-eq{font-size:32px}
  .cell{min-height:58px;padding:4px}.cell b{font-size:11px}
  .toolbar input[type=text]{width:100%}
  .pv{position:static}
  .crow{grid-template-columns:1fr 1fr}.crow .btn{grid-column:span 2}
  .overlay{padding:0}.dlg{border-radius:0;min-height:100%}
}
@media print{.side,.bottom,.top-r,.btn,#toast{display:none!important}.app{display:block}.card,.tw{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">TL</div><div><b id="brandName"></b><small id="brandSub">合約交易日誌</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span>帳戶淨值 (USDT)</span><b id="eqMini" class="num"></b></div>
  </aside>
  <main>
    <header class="top">
      <div><h1 id="title"></h1><p id="subtitle"></p></div>
      <div class="top-r">
        <select id="rangeSel" aria-label="統計區間">
          <option value="all">全部時間</option><option value="today">今日</option><option value="7d">近 7 天</option><option value="30d">近 30 天</option><option value="month">本月</option><option value="year">今年</option>
        </select>
        <button class="btn" id="cloudBtn" data-act="cloud">雲端…</button>
        <button class="btn icon" id="themeBtn" title="切換主題" aria-label="切換主題">◐</button>
        <button class="btn primary" data-act="new">新增交易</button>
      </div>
    </header>
    <div id="view"></div>
    <footer>本工具僅供交易紀錄與績效分析，不構成任何投資建議。資料預設儲存於本機瀏覽器，登入後可雲端同步；仍建議定期匯出備份。</footer>
  </main>
  <nav class="bottom" id="bnav"></nav>
</div>
<div id="modal" class="overlay"></div>
<div id="confirm" class="overlay top"></div>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="shotFile" accept="image/*" hidden>

<script>
(() => {
'use strict';
/* ============ utils ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : null; };
const sum = a => a.reduce((x, y) => x + y, 0);
const fmt = (n, d = 2) => (n == null || !isFinite(n)) ? '—' : n.toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const money = (n, d = 2) => n == null ? '—' : (n > 0 ? '+' : n < 0 ? '-' : '') + '$' + fmt(Math.abs(n), d);
const usd = (n, d = 2) => n == null ? '—' : (n < 0 ? '-' : '') + '$' + fmt(Math.abs(n), d);
const pct = (n, d = 1) => (n == null || !isFinite(n)) ? '—' : fmt(n * 100, d) + '%';
const sgn = n => n > 0 ? 'pos' : n < 0 ? 'neg' : '';
const price = n => n == null ? '—' : n >= 100 ? fmt(n, 2) : n >= 1 ? fmt(n, 4) : fmt(n, 6);
const pad = n => String(n).padStart(2, '0');
const toLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const nowLocal = () => toLocal(new Date());
const dayOf = s => s.slice(0, 10);
const fmtDT = s => s ? s.slice(5, 10).replace('-', '/') + ' ' + s.slice(11, 16) : '—';
const fmtDur = ms => { if (ms == null) return '—'; const m = Math.round(ms / 60000); if (m < 60) return m + ' 分'; const h = m / 60; if (h < 48) return fmt(h, 1) + ' 小時'; return fmt(h / 24, 1) + ' 天'; };
const ICON = {
  dashboard:'<path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/>',
  trades:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  analytics:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  discipline:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  grid:'<path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">${ICON[k]}</svg>`;
const NAV = [['dashboard','總覽'],['trades','合約紀錄'],['analytics','績效分析'],['discipline','交易紀律'],['grid','網格'],['calendar','盈虧日曆'],['settings','設定']];
const SUB = {dashboard:'帳戶表現與今日風控一覽', trades:'所有開倉與平倉紀錄', analytics:'從不同維度找出你的優勢與漏洞', discipline:'量化你的紀律，看見違規的代價', calendar:'逐日盈虧與週結', grid:'網格機器人獨立記帳，不計入合約績效', settings:'品牌、風控規則、清單與資料管理'};

/* ============ defaults & state ============ */
const DEFAULTS = {

/* ============ storage (IndexedDB) ============ */
const IDB = {
  db:null,
  open(){ return new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('no idb'));
    const r = indexedDB.open('tradeledger-pro', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('trades', {keyPath:'id'}); r.result.createObjectStore('kv'); };
    r.onsuccess = () => { this.db = r.result; res(); };
    r.onerror = () => rej(r.error);
  }); },
  run(store, mode, fn){ return new Promise((res, rej) => {
    const t = this.db.transaction(store, mode); const s = t.objectStore(store); const rq = fn(s);
    t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }); },
  all(){ return this.run('trades', 'readonly', s => s.getAll()); },
  put(o){ return this.run('trades', 'readwrite', s => s.put(o)); },
  putMany(a){ return this.run('trades', 'readwrite', s => { a.forEach(o => s.put(o)); }); },
  del(id){ return this.run('trades', 'readwrite', s => s.delete(id)); },
  delMany(ids){ return this.run('trades', 'readwrite', s => { ids.forEach(i => s.delete(i)); }); },

}

/* ============ normalize ============ */
function deriveClose(t){
  const cl = t.closes.slice().sort((a, b) => a.at < b.at ? -1 : a.at > b.at ? 1 : 0), tot = sum(cl.map(c => c.pct));
  t.closes = cl; t.feeClose = sum(cl.map(c => c.fee)); t.fees = t.feeOpen + t.feeClose + t.funding;
  if (tot >= 99.999) { t.exit = sum(cl.map(c => c.price * c.pct)) / tot; t.closeAt = cl[cl.length - 1].at; } else { t.exit = null; t.closeAt = null; }
}
function norm(o){
  if (!o || typeof o !== 'object') return null;
  const n = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : null; };
  const str = (v, l = 2000) => String(v ?? '').slice(0, l);
  const re = /^\d{4}-\d\d-\d\dT\d\d:\d\d$/;
  const t = {
    id:str(o.id || uid(), 40), coin:str(o.coin, 20).toUpperCase().trim(), dir:o.dir === 'Short' ? 'Short' : 'Long',
    lev:Math.max(1, Math.round(n(o.lev) || 1)), notional:n(o.notional), entry:n(o.entry), exit:n(o.exit), sl:n(o.sl), tp:n(o.tp),
    mode:['isolated', 'split'].includes(o.mode) ? o.mode : 'cross', mbal:(n(o.mbal) > 0 ? n(o.mbal) : null), liqPx:(n(o.liqPx) > 0 ? n(o.liqPx) : null), fees:0, feeOpen:0, feeClose:0, funding:0, closes:[], openAt:str(o.openAt, 16), closeAt:null, exchange:str(o.exchange, 60), strategy:str(o.strategy, 60), tf:str(o.tf, 10),
    emotion:str(o.emotion, 20), rating:Math.min(5, Math.max(0, Math.round(n(o.rating) || 0))),
    checks:Array.isArray(o.checks) ? o.checks.map(x => str(x, 40)) : [], mistakes:Array.isArray(o.mistakes) ? o.mistakes.map(x => str(x, 60)) : [],
    notes:str(o.notes), review:str(o.review), shot:(typeof o.shot === 'string' && o.shot.startsWith('data:image/') && o.shot.length <= 700000) ? o.shot : null, demo:!!o.demo, updatedAt:Math.max(0, n(o.updatedAt) || 0)
  };
  const split = o.feeOpen != null || o.feeClose != null || o.funding != null;
  t.feeOpen = split ? (n(o.feeOpen) || 0) : (n(o.fees) || 0); t.funding = split ? (n(o.funding) || 0) : 0;
  const cs = Array.isArray(o.closes) ? o.closes : (n(o.exit) != null ? [{price:o.exit, pct:100, at:o.closeAt || o.openAt, fee:split ? (n(o.feeClose) || 0) : 0}] : []);
  t.closes = cs.slice(0, 20).map(c => ({price:n(c && c.price), pct:n(c && c.pct), at:re.test(String(c && c.at)) ? c.at : t.openAt, fee:n(c && c.fee) || 0})).filter(c => c.price > 0 && c.pct > 0 && c.pct <= 100);
  deriveClose(t);
  if (!t.coin || !(t.entry > 0) || !(t.notional > 0) || !re.test(t.openAt)) return null;
  return t;
}

/* ============ calculations ============ */
function calc(t, eqIn){
  const size = t.entry > 0 ? t.notional / t.entry : 0;
  const margin = t.lev > 0 ? t.notional / t.lev : 0;
  const closed = t.exit != null, d = t.dir === 'Long' ? 1 : -1;
  const gross = closed ? (t.exit - t.entry) * d * size : null;
  const net = closed ? gross - (t.fees || 0) : null;
  const risk = t.sl != null ? Math.abs(t.entry - t.sl) * size : null;
  const R = closed && risk > 0 ? net / risk : null;
  const rr = (t.sl != null && t.tp != null && t.sl !== t.entry) ? Math.abs(t.tp - t.entry) / Math.abs(t.entry - t.sl) : null;
  const roi = closed && margin > 0 ? net / margin : null;
  const mm = (S.settings && S.settings.mmr != null ? S.settings.mmr : 0.5) / 100;
  const W = t.mbal > 0 ? t.mbal : (t.mode === 'isolated' || t.mode === 'split' ? margin : Math.max(eqIn != null ? eqIn : S.equity, 0));
  let liqEst = size > 0 ? (d === 1 ? (t.entry - W / size) / (1 - mm) : (t.entry + W / size) / (1 + mm)) : null;
  if (liqEst != null && liqEst <= 0) liqEst = null;
  const liq = t.liqPx > 0 ? t.liqPx : liqEst, liqDist = liq != null ? Math.abs(t.entry - liq) / t.entry : null;
  const cls = t.closes || [], closedPct = sum(cls.map(c => c.pct)), partial = sum(cls.map(c => (c.price - t.entry) * d * size * c.pct / 100 - (c.fee || 0)));
  const slWrong = t.sl != null && (d === 1 ? t.sl >= t.entry : t.sl <= t.entry);
  const tpWrong = t.tp != null && (d === 1 ? t.tp <= t.entry : t.tp >= t.entry);
  const hold = closed && t.closeAt ? new Date(t.closeAt) - new Date(t.openAt) : null;
  return {size, margin, gross, net, risk, R, rr, roi, liq, liqDist, closedPct, partial, slWrong, tpWrong, hold};
}
function violList(t, c, eq){
  const r = S.settings.rules, v = [];
  if (t.lev > r.maxLeverage) v.push({k:'lev', msg:`槓桿 ${t.lev}X 超過上限 ${r.maxLeverage}X`});
  if (r.requireSL && t.sl == null) v.push({k:'sl', msg:'未設定止損'});
  if (c.risk != null && eq > 0 && c.risk / eq * 100 > r.maxRiskPct) v.push({k:'risk', msg:`單筆風險 ${fmt(c.risk / eq * 100, 1)}% 超過 ${r.maxRiskPct}%`});
  return v;
}
const VL = {lev:'槓桿超限', sl:'規則：未設止損', risk:'單筆風險超限'};
function recompute(){
  const cap = S.settings.capital;
  const cl = S.trades.filter(t => t.exit != null && t.closeAt).sort((a, b) => a.closeAt < b.closeAt ? -1 : a.closeAt > b.closeAt ? 1 : 0);
  const pre = [0]; cl.forEach(t => pre.push(pre[pre.length - 1] + calc(t).net));
  S.equity = cap + pre[pre.length - 1] + sum(S.trades.filter(t => t.exit == null).map(t => calc(t).partial));
  S.D = {};
  const items = S.settings.checklist;
  S.trades.forEach(t => {
    let lo = 0, hi = cl.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (cl[m].closeAt < t.openAt) lo = m + 1; else hi = m; }
    const eq = Math.max(cap + pre[lo], 1);
    const c = calc(t, eq);
    const viol = violList(t, c, eq);
    const chk = items.length ? items.filter(i => t.checks.includes(i.id)).length / items.length : null;
    S.D[t.id] = {...c, viol, chk, eq, compliant: viol.length === 0 && t.mistakes.length === 0};
  });
}
function rangeFrom(){
  const r = S.range, n = new Date();
  if (r === 'today') return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}T00:00`;
  if (r === '7d') return toLocal(new Date(n - 7 * 864e5));
  if (r === '30d') return toLocal(new Date(n - 30 * 864e5));
  if (r === 'month') return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-01T00:00`;
  if (r === 'year') return `${n.getFullYear()}-01-01T00:00`;
  return '';
}
function dataset(){
  const from = rangeFrom();
  const all = S.trades.filter(t => t.exit != null && t.closeAt).sort((a, b) => a.closeAt < b.closeAt ? -1 : a.closeAt > b.closeAt ? 1 : 0);
  let base = S.settings.capital; const list = [];
  for (const t of all) { if (from && t.closeAt < from) base += S.D[t.id].net; else list.push(t); }
  return {list, base, all};
}
function stats(list, base){
  const n = list.length, nets = list.map(t => S.D[t.id].net);
  const Rs = list.map(t => S.D[t.id].R).filter(x => x != null);
  const w = nets.filter(x => x > 0), l = nets.filter(x => x < 0);
  const total = sum(nets), gp = sum(w), gl = -sum(l);
  let eq = base, peak = base, mdd = 0, mddPct = 0, cw = 0, cl = 0, mw = 0, ml = 0;
  const curve = [{t:null, eq:base}], dd = [];
  list.forEach((t, i) => {
    const x = nets[i]; eq += x; peak = Math.max(peak, eq);
    const d = peak - eq; mdd = Math.max(mdd, d); mddPct = Math.max(mddPct, peak > 0 ? d / peak : 0);
    curve.push({t:t.closeAt, eq}); dd.push(peak > 0 ? -(d / peak) * 100 : 0);
    if (x > 0) { cw++; cl = 0; } else if (x < 0) { cl++; cw = 0; } else { cw = 0; cl = 0; }
    mw = Math.max(mw, cw); ml = Math.max(ml, cl);
  });
  const holds = list.map(t => S.D[t.id].hold).filter(x => x != null);
  return {n, wins:w.length, losses:l.length, winRate:n ? w.length / n : null, total, gp, gl,
    pf: gl > 0 ? gp / gl : (gp > 0 ? Infinity : null), avgWin:w.length ? gp / w.length : null, avgLoss:l.length ? -gl / l.length : null,
    payoff:(w.length && l.length) ? (gp / w.length) / (gl / l.length) : null, exp:n ? total / n : null, avgR:Rs.length ? sum(Rs) / Rs.length : null,
    mdd, mddPct, curve, dd, mw, ml, curStreak:cw > 0 ? cw : -cl, best:n ? Math.max(...nets) : null, worst:n ? Math.min(...nets) : null,
    fees:sum(list.map(t => t.fees || 0)), avgHold:holds.length ? sum(holds) / holds.length : null, avgLev:n ? sum(list.map(t => t.lev)) / n : null,
    endEq:eq, base, roi:base > 0 ? total / base : null, recovery:mdd > 0 ? total / mdd : null};
}
const pf = v => v == null ? '—' : v === Infinity ? '∞' : fmt(v, 2);
function groupBy(list, keyFn, order){
  const m = {};
  list.forEach(t => { const k = keyFn(t), d = S.D[t.id]; const g = m[k] || (m[k] = {k, n:0, w:0, net:0, gp:0, gl:0}); g.n++; g.net += d.net; if (d.net > 0) { g.w++; g.gp += d.net; } else if (d.net < 0) g.gl -= d.net; });
  const a = Object.values(m);
  a.sort(order ? (x, y) => order.indexOf(x.k) - order.indexOf(y.k) : (x, y) => y.net - x.net);
  if (!order) a.sort((x, y) => y.net - x.net);
  return a;
}
function today(){ return nowLocal().slice(0, 10); }
function todayStatus(){
  const td = today();
  const pnl = sum(S.trades.filter(t => t.exit != null && t.closeAt && dayOf(t.closeAt) === td).map(t => S.D[t.id].net));
  const opened = S.trades.filter(t => dayOf(t.openAt) === td).length;
  return {pnl, opened};
}

function confirmBox(title, msg, ok = '確定', danger = false){
  return new Promise(res => {
    const c = $('#confirm');
    c.innerHTML = `<div class="dlg sm"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="row"><button class="btn" data-no>取消</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(ok)}</button></div></div>`;
    c.classList.add('show');
    const done = v => { c.classList.remove('show'); c.innerHTML = ''; res(v); };
    c.querySelector('[data-ok]').onclick = () => done(true);
    c.querySelector('[data-no]').onclick = () => done(false);
  });
}
function download(text, name, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function filtered(){
  const f = S.f;
  const a = S.trades.filter(t => {
    const d = S.D[t.id];
    if (f.status === 'open' && t.exit != null) return false;
    if (f.status === 'closed' && t.exit == null) return false;
    if (f.status === 'win' && !(d.net > 0)) return false;
    if (f.status === 'loss' && !(d.net < 0)) return false;
    if (f.status === 'viol' && d.compliant) return false;
    if (f.dir !== 'all' && t.dir !== f.dir) return false;
    if (f.coin !== 'all' && t.coin !== f.coin) return false;
    if (f.strategy !== 'all' && t.strategy !== f.strategy) return false;
    if (f.date && !(dayOf(t.openAt) === f.date || (t.closeAt && dayOf(t.closeAt) === f.date))) return false;
    if (f.q && !`${t.coin} ${t.strategy} ${t.exchange} ${t.notes} ${t.review} ${t.mistakes.join(' ')}`.toLowerCase().includes(f.q.toLowerCase())) return false;
    return true;
  });
  const nv = (t, k) => { const v = S.D[t.id][k]; return v == null ? -Infinity : v; };
  const so = {new:(x, y) => x.openAt < y.openAt ? 1 : -1, old:(x, y) => x.openAt < y.openAt ? -1 : 1, pnl_d:(x, y) => nv(y, 'net') - nv(x, 'net'), pnl_a:(x, y) => nv(x, 'net') - nv(y, 'net'), r_d:(x, y) => nv(y, 'R') - nv(x, 'R')};
  return a.sort(so[S.sort]);
}

function vCalendar(){
  const y = S.cal.getFullYear(), m = S.cal.getMonth(), {all} = dataset(), by = {};
  all.forEach(t => { const k = dayOf(t.closeAt), d = by[k] || (by[k] = {pnl:0, n:0}); d.pnl += S.D[t.id].net; d.n++; });
  const dim = new Date(y, m + 1, 0).getDate(), lead = new Date(y, m, 1).getDay(), td = today();
  const mx = Math.max(1, ...Object.entries(by).filter(([k]) => k.startsWith(`${y}-${pad(m + 1)}`)).map(([, v]) => Math.abs(v.pnl)));
  let html = ['日','一','二','三','四','五','六'].map(x => `<div class="h">${x}</div>`).join('') + '<div class="h">週結</div>';
  let wk = 0, wn = 0, mp = 0, mn = 0, days = 0, wd = 0, col = 0;
  const flush = () => { html += `<div class="cell wk"><span class="d">週</span><b class="${sgn(wk)}">${wn ? money(wk, 0) : '—'}</b></div>`; wk = 0; wn = 0; col = 0; };
  for (let i = 0; i < lead; i++) { html += '<div></div>'; col++; }
  for (let d = 1; d <= dim; d++) {
    const k = `${y}-${pad(m + 1)}-${pad(d)}`, v = by[k];
    if (v) { wk += v.pnl; wn += v.n; mp += v.pnl; mn += v.n; days++; if (v.pnl > 0) wd++; }
    const a = v ? Math.round(14 + Math.abs(v.pnl) / mx * 38) : 0;
    const bg = v ? `background:color-mix(in srgb, var(${v.pnl >= 0 ? '--pos' : '--neg'}) ${a}%, transparent)` : '';

function normGrid(o){
  if (!o || typeof o !== 'object') return null;
  const n = v => { const x = parseFloat(v); return Number.isFinite(x) ? x : null; }, str = (v, l = 2000) => String(v ?? '').slice(0, l), re = /^\d{4}-\d\d-\d\dT\d\d:\d\d$/;

    lev:Math.max(1, Math.round(n(o.lev) || 1)), low:n(o.low), high:n(o.high), grids:Math.max(0, Math.round(n(o.grids) || 0)), invest:n(o.invest),
    gridProfit:n(o.gridProfit) || 0, posPnl:n(o.posPnl) || 0, fees:n(o.fees) || 0, funding:n(o.funding) || 0, startAt:str(o.startAt, 16), endAt:re.test(String(o.endAt)) ? o.endAt : null, notes:str(o.notes), demo:!!o.demo, updatedAt:Math.max(0, n(o.updatedAt) || 0)};

function calcGrid(g){
  const net = g.gridProfit + g.posPnl - g.fees - (g.funding || 0), roi = g.invest > 0 ? net / g.invest : null;
  const end = g.endAt ? new Date(g.endAt) : new Date(), days = Math.max((end - new Date(g.startAt)) / 864e5, 0);
  const apr = (roi != null && days >= 1) ? roi / days * 365 : null;
  const width = (g.low > 0 && g.high > g.low) ? (g.high - g.low) / g.low : null, step = (width != null && g.grids > 0) ? width / g.grids : null;
  return {net, roi, days, apr, width, step};
}

function updatePV(){

  const cs = $('#clsum'); if (cs) { const tp = sum(t.closes.map(x => x.pct)); cs.textContent = t.closes.length ? `累計已平倉 ${fmt(tp, 1)}%，剩餘 ${fmt(Math.max(0, 100 - tp), 1)}%${tp > 100.0001 ? '（超過 100%）' : ''}` : '尚未平倉（持倉中）'; cs.className = tp100(t) ? 'neg' : 'muted'; }
  if (!ok) { pv.innerHTML = '<h4>即時試算</h4><p class="muted">輸入開倉價、倉位價值與槓桿後，這裡會即時計算風險與盈虧。</p>'; return; }
  const c = calc(t), eq = Math.max(S.equity, 1), v = violList(t, c, eq), warns = [];
  if (c.slWrong) warns.push(['bad', `止損價位置不合理（${t.dir === 'Long' ? '多單止損應低於開倉價' : '空單止損應高於開倉價'}）`]);
  if (c.tpWrong) warns.push(['bad', `止盈價位置不合理`]);
  if (t.sl != null && !c.slWrong && c.liq != null && (t.dir === 'Long' ? t.sl <= c.liq : t.sl >= c.liq)) warns.push(['bad', '止損價比估算強平價更遠，會先被強平']);
  v.forEach(x => warns.push(['bad', x.msg]));
  if (c.rr != null && c.rr < 1.5) warns.push(['warn', `預期盈虧比僅 ${fmt(c.rr, 2)}，低於 1.5`]);
  if (!FORM.editId) { const ts = todayStatus(); if (ts.pnl <= -S.settings.rules.maxDailyLoss) warns.push(['bad', '今日虧損已達上限，建議不要再開倉']); else if (ts.opened >= S.settings.rules.maxTradesPerDay) warns.push(['warn', `今日已開 ${ts.opened} 筆，達到筆數上限`]); }
  if (!warns.length && t.sl != null) warns.push(['ok', '符合所有風控規則']);
  const head = c.net != null ? `<div class="big ${sgn(c.net)}">${money(c.net)}</div>` : `<div class="big muted">持倉中</div>`;
  pv.innerHTML = `<h4>${c.net != null ? '實際淨盈虧' : '即時試算'}</h4>${head}<dl>

    <dt>止損風險</dt><dd>${c.risk != null ? usd(c.risk) + ' (' + fmt(c.risk / eq * 100, 2) + '%)' : '未設定'}</dd><dt>預期盈虧比</dt><dd>${c.rr != null ? fmt(c.rr, 2) : '—'}</dd>
    ${c.net != null ? `<dt>費用合計</dt><dd>${usd(t.fees)}</dd><dt>毛盈虧</dt><dd class="${sgn(c.gross)}">${money(c.gross)}</dd><dt>R 倍數</dt><dd class="${sgn(c.R)}">${c.R != null ? fmt(c.R, 2) + 'R' : '—'}</dd><dt>保證金報酬率</dt><dd class="${sgn(c.roi)}">${pct(c.roi)}</dd>` : ''}</dl>
    ${warns.length ? `<ul>${warns.map(w => `<li class="${w[0]}">${esc(w[1])}</li>`).join('')}</ul>` : ''}`;
}
async function submitForm(e){
  e.preventDefault();
  const t = readForm(), err = m => { $('#ferr').textContent = m; };
  if (!t.coin) return err('請輸入幣種');
  if (!(t.lev >= 1)) return err('槓桿至少為 1');
  if (!(t.notional > 0)) return err('請輸入倉位價值');
  if (!(t.entry > 0)) return err('請輸入開倉價');
  if (!t.openAt) return err('請選擇開倉時間');
  if (t._bad) return err('平倉紀錄有欄位未填完整：需要平倉價、比例（0–100%）與時間');
  if (tp100(t)) return err('累計平倉比例不能超過 100%');
  if (t.closes.some(c => c.at < t.openAt)) return err('平倉時間不能早於開倉時間');
  const old = S.trades.find(x => x.id === t.id); if (old && old.demo) t.demo = true; t.updatedAt = Date.now();
  const n = norm(t); if (!n) return err('資料格式有誤，請檢查欄位');
  const i = S.trades.findIndex(x => x.id === n.id); if (i >= 0) S.trades[i] = n; else S.trades.push(n);
  await persist(() => IDB.put(n));
  recompute(); closeModal(); render(); toast(old ? '已儲存變更' : '已記錄交易');
}
function resizeShot(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 900 / im.width), cv = document.createElement('canvas'); cv.width = im.width * k; cv.height = im.height * k; cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); const out = cv.toDataURL('image/jpeg', .6); if (out.length > 700000) rej(new Error('big')); else res(out); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

async function jsonImport(file){
  try {
    const data = JSON.parse(await file.text()); if (!data || !Array.isArray(data.trades)) throw new Error('bad');
    const ts = data.trades.map(norm).filter(Boolean);
    if (!(await confirmBox('匯入備份', `找到 ${ts.length} 筆有效交易。相同 ID 的紀錄會被覆蓋，其餘會合併；備份中的設定也會一併套用。`, '匯入'))) return;
    ts.forEach(n => { const i = S.trades.findIndex(x => x.id === n.id); if (i >= 0) S.trades[i] = n; else S.trades.push(n); });
    if (Array.isArray(data.grids)) { data.grids.map(normGrid).filter(Boolean).forEach(n => { const i = S.grids.findIndex(x => x.id === n.id); if (i >= 0) S.grids[i] = n; else S.grids.push(n); }); await saveGrids(); }

}
function authMsg(e){
  const m = {'auth/invalid-credential':'Email 或密碼不正確', 'auth/wrong-password':'密碼不正確', 'auth/user-not-found':'找不到此帳號', 'auth/email-already-in-use':'這個 Email 已經註冊過', 'auth/weak-password':'密碼至少需要 6 個字元',
    'auth/invalid-email':'Email 格式不正確', 'auth/too-many-requests':'嘗試次數過多，請稍後再試', 'auth/network-request-failed':'網路連線失敗', 'auth/popup-closed-by-user':'已取消登入', 'auth/popup-blocked':'瀏覽器擋住了登入視窗',
    'auth/operation-not-allowed':'尚未在 Firebase 後台啟用此登入方式', 'auth/unauthorized-domain':'目前網域尚未加入 Firebase 授權網域，請改用 Hosting 網址或 localhost', 'auth/operation-not-supported-in-this-environment':'目前環境不支援此登入方式，請用 http(s) 網址開啟'};
  return m[e.code] || ('登入失敗：' + (e.code || e.message));
}
function authHTML(){
  const su = FB.mode === 'signup';
  return `<div class="dlg sm" style="max-width:420px"><h3>${su ? '註冊帳號' : '登入'}</h3><p>${su ? '建立帳號後，你的交易紀錄會同步到雲端，換裝置也能使用。' : '登入後，交易紀錄會在你的所有裝置同步，這台裝置上現有的資料會一併上傳。'}</p>
  <form id="af" novalidate><div class="field"><label class="fl" for="a_email">Email</label><input type="text" id="a_email" autocomplete="email" inputmode="email"></div>
  <div class="field"><label class="fl" for="a_pw">密碼（至少 6 個字元）</label><input type="password" id="a_pw" autocomplete="${su ? 'new-password' : 'current-password'}"></div>
  <div id="aerr" class="neg" style="min-height:20px;font-size:13px;margin-bottom:6px"></div>
  <button class="btn primary" style="width:100%;margin-bottom:8px" type="submit">${su ? '建立帳號' : '登入'}</button></form>
  <button class="btn" style="width:100%;margin-bottom:12px" data-act="google">使用 Google 登入</button>
  <div style="display:flex;justify-content:space-between;font-size:13px"><a href="#" data-act="amode" style="color:var(--accent)">${su ? '已有帳號？登入' : '沒有帳號？註冊'}</a>${su ? '' : '<a href="#" data-act="reset" style="color:var(--accent)">忘記密碼</a>'}</div>
  <div class="row" style="margin-top:16px"><button class="btn" data-act="close">稍後再說</button></div></div>`;
}
function openCloud(){
  if (!FIREBASE_CONFIG.apiKey) return;
  if (!FB.ready) { openModal(`<div class="dlg sm"><h3>雲端服務尚未連線</h3><p>${FB.failed ? '無法載入 Firebase，請確認網路後重新整理頁面。' : '正在連線，請稍候再試。'}</p><div class="row"><button class="btn" data-act="close">關閉</button></div></div>`); return; }
  if (!FB.user) { openModal(authHTML()); return; }
  const st = {syncing:'同步中…', ok:'已同步', error:'同步失敗' + (FB.detail ? `（${FB.detail}）` : ''), off:'未連線'}[FB.status];
  openModal(`<div class="dlg sm" style="max-width:440px"><h3>雲端同步</h3><p>已登入：<b>${esc(FB.user.email || '（Google 帳號）')}</b><br>狀態：${esc(st)}</p>
  ${FB.detail === 'permission-denied' ? '<p class="neg">權限不足：請先在 Firebase 後台發布 Firestore 安全規則。</p>' : ''}
  <div class="row"><button class="btn" data-act="close">關閉</button><button class="btn" data-act="syncnow">立即同步</button><button class="btn danger" data-act="logout">登出</button></div></div>`);
}
async function authSubmit(e){
  e.preventDefault();
  const em = $('#a_email').value.trim(), pw = $('#a_pw').value, er = m => { $('#aerr').textContent = m; }, btn = e.target.querySelector('[type=submit]');
  if (!em || !pw) return er('請輸入 Email 與密碼');
  btn.disabled = true;
  try {
    if (FB.mode === 'signup') await FB.A.createUserWithEmailAndPassword(FB.auth, em, pw); else await FB.A.signInWithEmailAndPassword(FB.auth, em, pw);
    closeModal(); toast('登入成功，正在同步');
  } catch (x) { er(authMsg(x)); btn.disabled = false; }
}

/* ============ boot ============ */
(async function boot(){
  S.settings = mergeSettings({});
  try {
    await IDB.open();
    const saved = await IDB.getKV('settings'); if (saved) S.settings = mergeSettings(saved);
    S.trades = (await IDB.all()).map(norm).filter(Boolean);
    const sg = await IDB.getKV('grids'); if (Array.isArray(sg)) S.grids = sg.map(normGrid).filter(Boolean);
  } catch (e) { toast('無法使用本機儲存，資料將不會保留'); warned = true; }
  applyTheme(); buildNav(); recompute(); render(); chromeCloud(); fbInit();
})();
})();
</script>
</body>
</html>
